const TWH={'Le Nexus Insider':'@NexusInsider','Faille Hebdo':'@FailleHebdo','@RiftLeaks':'@RiftLeaks','Mercato LoL FR':'@MercatoLoLFR','Baron Report':'@BaronReport','Coulisses de la Faille':'@CoulissesFaille'};
function addTweet(o){if(!S.tw)S.tw=[];const big=o.tid!=null&&S.teams[o.tid]?clamp(teamOvr(S.teams[o.tid])-55,5,40):12,mine=o.mine?3:1;
  o.id=S.nx++;o.s=S.season;o.w=S.week;o.likes=Math.round(big*rnd(40,160)*mine);o.rts=Math.round(o.likes*rnd(.12,.3));o.rep=Math.round(o.likes*rnd(.03,.1));
  S.tw.unshift(o);if(S.tw.length>60)S.tw.length=60}
function txTweet(p,from,to,fee){try{const F=from!=null?T(from):null,D=to!=null?T(to):null,mine=from===S.U||to===S.U,rl=ROLE_FR[p.role];
  if(D)addTweet({who:D.name,handle:'@'+String(D.tag).replace(/\W/g,''),tid:D.id,ver:1,kind:'off',mine,txt:pick(['OFFICIEL ✍️ Bienvenue à '+p.name+' ! Notre nouveau '+rl+' arrive'+(F?' en provenance de '+F.name:' libre de tout contrat')+'. 💜','C\'est signé ! '+p.name+' ('+rl+') rejoint '+D.name+'.'+(fee?' Transfert estimé à '+ke(fee)+'.':''),'🚨 '+p.name+' est un joueur de '+D.name+' ! Bienvenue à la maison.'])});
  else if(F)addTweet({who:F.name,handle:'@'+String(F.tag).replace(/\W/g,''),tid:F.id,ver:1,kind:'off',mine,txt:'Merci pour tout, '+p.name+' 🙏 Notre '+rl+' quitte le club. Bonne suite !'});
  if(D&&F&&Math.random()<.6)addTweet({who:pick(['Le Nexus Insider','Mercato LoL FR','Baron Report']),kind:'press',mine,txt:'Mouvement '+(F.lg===D.lg?F.lg:F.lg+' → '+D.lg)+' : '+p.name+' ('+F.tag+') file chez '+D.tag+'.'+(fee?' Montant : '+ke(fee)+'.':'')+' Votre avis ? 👇'})}catch(e){}}
function txRec(p,from,to,fee){txTweet(p,from,to,fee);S.tx.unshift({s:S.season,w:S.week,n:p.name,r:p.role,f:from,t:to,fee,u:from===S.U||to===S.U});if(S.tx.length>80)S.tx.length=80}
const tagOf=id=>id==null?'Libre':T(id).tag;

/* --- Négociation du joueur avec vous --- */
function startNeg(pid){const p=S.players[pid],w=mwin(),t=me();if(!p||p.team===S.U)return;
  const key=w.open?w.key:'S'+S.season+'W'+S.week;
  let n=S.negs.find(x=>x.pid===pid&&x.key===key&&x.stage!=='done');if(n){U.negId=n.id;return}
  if(t.roster.length>=9){toast('Effectif complet (9 joueurs) : placez d\'abord un joueur sur la liste des transferts.');return}
  if(p.team!==null&&!w.open){toast('Fenêtre de transferts fermée : seuls les joueurs libres peuvent signer.');return}
  n={id:S.nx++,pid,from:p.team,key,s:S.season,w:S.week,log:[],stage:'club',pat:3,apat:3};
  const it=interestOf(p)+negNoise(n,'i')*16-8;n.int=Math.round(it);
  if(it<-12){n.stage='fail';
    const pl=p.team!=null?LG[T(p.team).lg]:null,rk=curRank(),why=!wouldStart(p)?'Il veut jouer titulaire, et votre '+ROLE_FR[p.role]+' actuel est mieux noté que lui.':pl&&pl.lvl>LG[S.lg].lvl+2?'Quitter la '+pl.id+' pour la '+S.lg+' serait un pas en arrière dans sa carrière.':rk>LT().length/2?'Un club classé '+rk+'e de '+S.lg+' ne correspond pas à son plan de carrière.':'Votre projet ne lui paraît pas assez ambitieux pour un joueur de son niveau.';
    n.log.push({w:'agent',t:'Merci de votre intérêt, mais '+p.name+' ne souhaite pas rejoindre '+t.name+' pour le moment. '+why})}
  else{n.log.push({w:'agent',t:it<5?'Mon client accepte d\'écouter votre proposition, mais il faudra le convaincre.':'Mon client suit votre projet de près. Il est ouvert à la discussion.'});
    if(p.team===null){n.stage='agent';initAgent(n,p)}
    else{const club=T(p.team),pos=club.lg===S.lg?standings().findIndex(x=>x.id===club.id):99,starter=club.lineup[p.role]===p.id;
      if(starter&&pos<LT().length/2&&negNoise(n,'r')<.5){n.stage='fail';n.ask=0;n.log.push({w:'club',t:'Nous ne vendrons pas un titulaire à un concurrent direct en '+S.lg+'. Le dossier est clos.'})}
      else{n.ask=Math.round(value(p)*(starter?1.35:1)*(p.contract>=2?1.15:1));n.res=Math.round(n.ask*(.8+negNoise(n,'c')*.16));n.dfee=Math.round(n.ask*.85);
        n.log.push({w:'club',t:club.name+' accepte d\'ouvrir les discussions pour '+p.name+'. Notre prix : '+ke(n.ask)+'.'})}}}
  S.negs.unshift(n);if(S.negs.length>24)S.negs.length=24;U.negId=n.id}
function initAgent(n,p){n.dem=Math.round(salaryFor(p)*(1.1+(n.int<5?.25:0))*10)/10;n.pref=p.age<=20?1:p.age<=25?2:3;n.years=n.pref;
  n.sres=n.dem*(.86+negNoise(n,'s')*.1);n.bonus=Math.round(n.dem*(n.from===null?4:2));n.dsal=Math.round(n.dem*.9*10)/10;n.apat=3;
  n.log.push({w:'agent',t:'Nos conditions : '+n.dem.toLocaleString('fr-FR')+' k€ par semaine, une prime à la signature de '+ke(n.bonus)+', et idéalement un contrat de '+n.pref+' saison'+(n.pref>1?'s':'')+'.'})}
function negOpen(n){const w=mwin();return n.from===null||(w.open&&w.key===n.key)}
function clubOffer(n,v){const p=S.players[n.pid];v=Math.round(v);if(n.stage!=='club'||!(v>0)||!p)return;
  if(!negOpen(n)){n.stage='fail';n.log.push({w:'sys',t:'La fenêtre de transferts a fermé.'});return}
  if(p.team!==n.from){n.stage='fail';n.log.push({w:'sys',t:p.name+' a été transféré ailleurs entre-temps.'});return}
  if(v>S.budget){toast('Budget insuffisant pour cette offre ('+ke(S.budget)+').');return}
  n.log.push({w:'me',t:'Nous proposons '+ke(v)+'.'});
  if(v>=n.res){n.fee=v;n.stage='agent';n.log.push({w:'club',t:'Marché conclu à '+ke(v)+'. Vous pouvez discuter du contrat avec son agent.'});initAgent(n,p)}
  else if(v<n.res*.7){n.pat-=2;n.log.push({w:'club',t:'Cette offre n\'est pas sérieuse.'+(n.pat>0?' Revenez avec une vraie proposition.':'')})}
  else{n.pat--;const c=Math.max(n.res,Math.round((n.ask+v)/2/5)*5);n.ask=c;n.dfee=c;if(n.pat>0)n.log.push({w:'club',t:'C\'est insuffisant. Nous pouvons descendre à '+ke(c)+', pas en dessous.'})}
  if(n.pat<=0&&n.stage==='club'){n.stage='fail';n.log.push({w:'club',t:'Nous mettons fin aux discussions. '+p.name+' reste chez nous.'})}}
function agentOffer(n,s){const p=S.players[n.pid];s=Math.round(s*10)/10;if(n.stage!=='agent'||!(s>0)||!p)return;
  if(!negOpen(n)){n.stage='fail';n.log.push({w:'sys',t:'La fenêtre de transferts a fermé.'});return}
  const y=n.years,R=n.sres*(y===n.pref?.96:1.05);
  n.log.push({w:'me',t:'Contrat proposé : '+s.toLocaleString('fr-FR')+' k€ par semaine sur '+y+' saison'+(y>1?'s':'')+'.'});
  if(s>=R){n.sal=s;n.stage='sign';n.log.push({w:'agent',t:'Nous avons un accord. Il ne reste qu\'à signer.'})}
  else if(s<R*.75){n.apat-=2;n.log.push({w:'agent',t:'C\'est loin de sa valeur sur le marché.'+(n.apat>0?' Faites un effort.':'')})}
  else{n.apat--;const c=Math.max(Math.round(R*10)/10,Math.round((n.dem+s)/2*10)/10);n.dem=c;n.dsal=c;
    if(n.apat>0)n.log.push({w:'agent',t:'Mon client attend au moins '+c.toLocaleString('fr-FR')+' k€ par semaine'+(y!==n.pref?', et il préfère un contrat de '+n.pref+' saison'+(n.pref>1?'s':''):'')+'.'})}
  if(n.apat<=0&&n.stage==='agent'){n.stage='fail';n.log.push({w:'agent',t:'Nous allons étudier d\'autres pistes. Bonne continuation.'})}}
function signNeg(n){const p=S.players[n.pid],t=me();if(n.stage!=='sign'||!p)return;const total=(n.fee||0)+n.bonus;
  if(!negOpen(n)){n.stage='fail';n.log.push({w:'sys',t:'La fenêtre de transferts a fermé avant la signature.'});return}
  if(p.team!==n.from){n.stage='fail';n.log.push({w:'sys',t:p.name+' a signé ailleurs entre-temps.'});return}
  if(t.roster.length>=9){toast('Effectif complet (9 joueurs).');return}
  if(S.budget<total){toast('Budget insuffisant : il faut '+ke(total)+'.');return}
  S.budget-=total;const from=p.team;
  if(from!==null){const x=T(from),r=p.role;x.roster=x.roster.filter(i=>i!==p.id);let rep=bestFA(r,ovr(p)+2);if(!rep){rep=genPlayer(r,ovr(p)-5);S.fa.push(rep.id)}joinTeam(rep,x.id);if(x.lineup[r]===p.id)x.lineup[r]=rep.id}
  else S.fa=S.fa.filter(i=>i!==p.id);
  p.team=S.U;t.roster.push(p.id);p.contract=n.years;p.salary=n.sal;p.morale=82;p.known=true;
  const cur=S.players[t.lineup[p.role]];if(!cur||ovr(p)>ovr(cur))t.lineup[p.role]=p.id;
  txRec(p,from,S.U,n.fee||0);news('Officiel : '+p.name+' ('+ROLE_FR[p.role]+') rejoint '+t.name+(n.fee?' contre '+ke(n.fee):' libre')+'.');
  n.stage='done';n.log.push({w:'sys',t:'Signature officielle. '+p.name+' rejoint '+t.name+'.'});SFX.cash();toast(p.name+' rejoint l\'équipe.','gold')}

/* --- Liste des transferts et libération --- */
function toggleList(pid){const p=S.players[pid];if(!p||p.team!==S.U)return;if(S.tlist[pid])delete S.tlist[pid];else S.tlist[pid]=Math.max(10,Math.round(value(p)/5)*5)}
function relFee(p){return Math.round(p.salary*Math.max(1,p.contract)*2)}
function releasePlayer(pid){const p=S.players[pid],t=me();if(!p||p.team!==S.U)return;if(t.roster.filter(x=>S.players[x].role===p.role).length<2){toast('Seul joueur à ce poste : recrutez d\'abord un remplaçant.');return}
  const f=relFee(p);if(S.budget<f){toast('Budget insuffisant pour l\'indemnité ('+ke(f)+').');return}
  S.budget-=f;delete S.tlist[pid];toFA(p);ensureLineup(t);txRec(p,S.U,null,0);news(p.name+' est libéré de son contrat ('+ke(f)+' d\'indemnité).')}
function offerMail(p,b,amt,why){addMail({k:'offer',from:b.name,subj:'Offre pour '+p.name,pid:p.id,tid:b.id,amt,exp:1,
  body:'Bonjour,\n\n'+why+' Nous proposons '+ke(amt)+' pour le transfert immédiat de '+p.name+' ('+ROLE_FR[p.role]+', niveau '+Math.round(ovr(p))+').\n\nCette offre tient jusqu\'à la fermeture de la fenêtre.\n\nLa direction sportive de '+b.name})}
const hasOffer=pid=>S.mail.some(m=>m.st!=='done'&&m.k==='offer'&&m.pid===pid);

/* --- Transferts entre équipes IA --- */
function pickAIMove(t,used){const rs=ROLES.slice().sort((a,b)=>ovr(S.players[t.lineup[a]])-ovr(S.players[t.lineup[b]])),r=rs[Math.random()<.7?0:1],s=S.players[t.lineup[r]];if(!s)return null;
  const o=ovr(s),cap=LG[t.lg].lvl*LG[t.lg].lvl/5,realOnly=s.src==='file'&&s.age<30;
  const c=Object.values(S.players).filter(p=>p.role===r&&p.team!==t.id&&p.team!==S.U&&!used.has(p.id)&&(!realOnly||p.src==='file')&&!S.tlist[p.id]&&ovr(p)>o+1.5&&ovr(p)<o+10&&
    (p.team===null||(LG[T(p.team).lg].lvl<=LG[t.lg].lvl+3&&value(p)*1.2<=cap&&T(p.team).lineup[p.role]!==p.id))).sort((a,b)=>ovr(b)-ovr(a));
  return c.length?c[ri(0,Math.min(2,c.length-1))]:null}
function aiTransfer(pl){const p=S.players[pl.pid],to=S.teams[pl.to];if(!p||!to||p.team!==pl.from||p.team===S.U||to.id===S.U||to.roster.includes(p.id))return false;
  const r=p.role,from=p.team,fee=from===null?0:Math.round(value(p)*rnd(1,1.3)/5)*5;
  if(from!==null){const x=T(from);x.roster=x.roster.filter(i=>i!==p.id);let rep=bestFA(r,ovr(p)+1);if(!rep){rep=genPlayer(r,ovr(p)-4);S.fa.push(rep.id)}joinTeam(rep,x.id);
    if(x.lineup[r]===p.id||!x.roster.includes(x.lineup[r]))x.lineup[r]=rep.id}
  else S.fa=S.fa.filter(i=>i!==p.id);
  const old=S.players[to.lineup[r]];p.team=to.id;to.roster.push(p.id);to.lineup[r]=p.id;p.salary=salaryFor(p);p.contract=ri(1,3);
  if(old&&old.id!==p.id&&old.team===to.id&&to.roster.length>7){const sub=to.roster.map(id=>S.players[id]).filter(x=>x.id!==p.id&&!Object.values(to.lineup).includes(x.id)).sort((a,b)=>(a.src==='file')-(b.src==='file')||ovr(a)-ovr(b))[0];if(sub)toFA(sub)}
  txRec(p,from,to.id,fee);if(to.lg===S.lg||(from!==null&&T(from).lg===S.lg))news('Officiel : '+p.name+' ('+ROLE_FR[r]+') '+(from===null?'signe libre chez '+to.tag:'quitte '+tagOf(from)+' pour '+to.tag+' ('+ke(fee)+')')+'.');return true}

/* --- Leaks et rumeurs --- */
const LEAKSRC=['Le Nexus Insider','Faille Hebdo','@RiftLeaks','Mercato LoL FR','Baron Report','Coulisses de la Faille'];
function addLeak(txt,real,lg){const L={id:S.nx++,s:S.season,w:S.week,src:pick(LEAKSRC),txt,conf:real?ri(2,5):ri(1,3),st:'pending',lg};S.leaks.unshift(L);if(S.leaks.length>40)S.leaks.length=40;addTweet({who:L.src,kind:'leak',conf:L.conf,lid:L.id,txt:'🔎 '+txt});return L.id}
function moveLeakTxt(p,to){const fr=p.team!=null?T(p.team):null,nm=p.name+' ('+(fr?fr.tag+', ':'')+ROLE_FR[p.role]+')';
  return fr?pick([nm+' serait en discussions avancées avec '+to.name+'.','Selon nos informations, '+to.name+' a fait une offre pour '+nm+'.',nm+' aurait fait part de son envie de partir. '+to.name+' est sur le coup.','Accord verbal entre '+fr.name+' et '+to.name+' pour '+p.name+' ('+ROLE_FR[p.role]+').'])
    :pick(['Libre, '+nm+' serait tout proche de signer chez '+to.name+'.','Le joueur libre '+nm+' a passé des tests avec '+to.name+'.'])}
function genPlans(nReal,nFake,at,pLeak){const used=new Set(S.plans.map(x=>x.pid)),teams=shuffle(S.teams.filter(t=>t.id!==S.U));let k=0;
  for(const t of teams){if(k>=nReal)break;const p=pickAIMove(t,used);if(!p)continue;used.add(p.id);k++;
    const pl={id:S.nx++,pid:p.id,from:p.team,to:t.id,at:typeof at==='function'?at():at,real:true,kind:'move'};
    if(Math.random()<pLeak)pl.leak=addLeak(moveLeakTxt(p,t),true,t.lg);S.plans.push(pl)}
  for(let i=0;i<nFake;i++){const c=Object.values(S.players).filter(x=>x.team!=null&&x.team!==S.U&&ovr(x)>=62&&!used.has(x.id));if(!c.length)break;const p=pick(c);
    const d=S.teams.filter(t=>t.id!==S.U&&t.id!==p.team&&LG[t.lg].lvl>=LG[T(p.team).lg].lvl-3);if(!d.length)continue;const t=pick(d);used.add(p.id);
    S.plans.push({id:S.nx++,pid:p.id,from:p.team,to:t.id,at:typeof at==='function'?at():at,real:false,kind:'move',leak:addLeak(moveLeakTxt(p,t),false,t.lg)})}}
function userLeak(at){const t=me(),ps=ROLES.map(r=>S.players[t.lineup[r]]).filter(p=>p&&!hasOffer(p.id)&&!S.plans.some(x=>x.pid===p.id));if(!ps.length)return;
  const p=ps.sort((a,b)=>ovr(b)-ovr(a))[ri(0,Math.min(2,ps.length-1))],b=S.teams.filter(x=>x.id!==S.U&&LG[x.lg].lvl>=LG[S.lg].lvl&&ovr(S.players[x.lineup[p.role]])<ovr(p)+1);if(!b.length)return;
  const x=pick(b),real=Math.random()<.75;S.plans.push({id:S.nx++,pid:p.id,from:S.U,to:x.id,at,real,kind:'offer',leak:addLeak(pick([x.name+' s\'intéresse de près à '+p.name+' ('+t.tag+', '+ROLE_FR[p.role]+').',p.name+' ('+t.tag+') serait la priorité de '+x.name+' pour le poste de '+ROLE_FR[p.role]+'.']),real,x.lg)})}
/* Appelé chaque semaine (après le match), en fin de saison et au lancement de la saison */
function marketWeek(){if(!S||!S.plans)return;const w=mwin(),now=absW();
  S.plans.forEach(pl=>{if(pl.done||now<pl.at)return;pl.done=true;let ok=false;
    if(pl.real){if(pl.kind==='offer'){const p=S.players[pl.pid];if(p&&p.team===S.U&&w.open&&!hasOffer(p.id)){offerMail(p,T(pl.to),Math.round(value(p)*rnd(1,1.4)/5)*5,'Nous suivons '+p.name+' depuis plusieurs semaines.');ok=true}}else ok=aiTransfer(pl)}
    if(pl.leak){const L=S.leaks.find(x=>x.id===pl.leak);if(L)L.st=ok?'ok':'no'}});
  S.plans=S.plans.filter(x=>!x.done);
  S.negs.forEach(n=>{if(n.from!==null&&['club','agent','sign'].includes(n.stage)&&!(w.open&&w.key===n.key)){n.stage='fail';n.log.push({w:'sys',t:'La fenêtre de transferts a fermé.'})}});
  if(w.open){
    Object.keys(S.tlist).forEach(k=>{const p=S.players[k];if(!p||p.team!==S.U){delete S.tlist[k];return}if(hasOffer(p.id))return;
      const ask=S.tlist[k],b=S.teams.filter(x=>x.id!==S.U&&ovr(S.players[x.lineup[p.role]])<ovr(p)+1.5&&LG[x.lg].lvl>=LG[S.lg].lvl-8),ch=clamp(.6-(ask/Math.max(1,value(p))-1)*.9,.08,.85);
      if(b.length&&Math.random()<ch)offerMail(p,pick(b),Math.max(5,Math.round(ask*rnd(.75,1.03)/5)*5),'Nous avons vu que '+p.name+' figure sur votre liste des transferts.')});
    if(S.phase==='offseason'){if(S.offPlan!==S.season){S.offPlan=S.season;genPlans(6,3,(S.season+1)*100+1,.7);userLeak((S.season+1)*100+1)}}
    else if(!(S.season===1&&w.key==='1A')){genPlans(ri(0,2),Math.random()<.5?1:0,()=>S.season*100+Math.min(S.week+ri(0,1),w.endW),.75);if(Math.random()<.25)userLeak(now+1)}}
  else if(w.next&&w.next-S.week===1){genPlans(2,1,S.season*100+w.next,1)}}

/* --- Écrans --- */
function leakPanel(){const L=S.leaks.slice(0,4);
  return '<section class="panel"><div class="row sp"><h2>Leaks du mercato</h2><span class="muted small">'+esc(mwin().open?'Fenêtre ouverte':'Fenêtre fermée')+'</span></div>'+
  (L.length?'<div class="leaks">'+L.map(x=>'<div class="leak '+x.st+'"><div class="row sp"><span class="lsrc">'+esc(x.src)+'</span><span class="ldots" title="Fiabilité de la source">'+dots(x.conf,5)+'</span></div><div>'+esc(x.txt)+'</div><div class="row sp small"><span class="muted">S'+x.s+' · sem. '+x.w+(x.lg?' · '+esc(x.lg):'')+'</span><span class="pill '+(x.st==='ok'?'q':x.st==='no'?'w':'')+'">'+(x.st==='ok'?'Officiel':x.st==='no'?'Démenti':'Rumeur')+'</span></div></div>').join('')+'</div>'
  :'<div class="muted small">Pas encore de rumeur. Les leaks arrivent à l\'approche et pendant les fenêtres de transferts.</div>')+'</section>'}
function vMk(){const w=mwin(),t=me(),full=t.roster.length>=9,tab=U.mtab||'search';
  if(U.negId){const n=S.negs.find(x=>x.id===U.negId);if(n)return vNeg(n);U.negId=null}
  const act=S.negs.filter(n=>['club','agent','sign'].includes(n.stage)).length,nl=Object.keys(S.tlist).length,at=attract(),offers=S.mail.filter(m=>m.st!=='done'&&m.k==='offer').length;

/* Finances */
function vFin(){const t=me(),f=LG[S.lg].f,staff=Math.round(6*f)+Math.round(staffSalary()),sal=Math.round(t.roster.reduce((s,id)=>s+S.players[id].salary,0)),merch=merchOf(),inc=S.sponsor.weekly+merch,out=sal+staff,net=inc-out;
  const head=pageHead('Finances',[['Budget',ke(S.budget),S.budget<0?'bad':'gold'],['Solde par semaine',sgn(net),net>=0?'good':'bad'],['Revenus par semaine','+'+inc+'<small> k€</small>'],['Dépenses par semaine','−'+out+'<small> k€</small>'],['Confiance de la direction',S.conf+' %',S.conf<35?'bad':'']],'','Hors primes de victoire, dotations de fin de saison et transferts.');
  const F=S.finance.slice(-16),nice=v=>v<=0?0:Math.ceil(v/(v>200?100:v>50?25:10))*(v>200?100:v>50?25:10),hi=nice(Math.max(0,...F.map(x=>x.net))),lo=-nice(-Math.min(0,...F.map(x=>x.net))),H=170,span=Math.max(10,hi-lo),y=v=>8+(hi-v)/span*(H-16);
  const W=1100,step=F.length?(W-60)/F.length:0,bw=Math.min(24,Math.max(6,step-10));
  const chart=F.length?'<div class="fin-chart"><svg viewBox="0 0 '+W+' '+(H+22)+'" width="100%" role="img" aria-label="Solde des '+F.length+' dernières semaines, de '+sgn(Math.min(...F.map(x=>x.net)))+' à '+sgn(Math.max(...F.map(x=>x.net)))+'">'+
    (lo<0?[hi,0,lo]:[hi,Math.round(hi/2),0]).filter((v,i,A)=>A.indexOf(v)===i).map(v=>'<line x1="46" x2="'+W+'" y1="'+y(v)+'" y2="'+y(v)+'" class="fc-grid'+(v===0?' z':'')+'"/><text x="40" y="'+(y(v)+4)+'" class="fc-tick" text-anchor="end">'+(v>0?'+':v<0?'−':'')+Math.abs(v)+'</text>').join('')+
    F.map((x,i)=>{const cx=52+i*step+(step-bw)/2,h0=y(0),hv=y(x.net),top=Math.min(h0,hv),hh=Math.max(1,Math.abs(hv-h0)),pos=x.net>=0,r=Math.min(4,hh);
      const d=pos?'M'+cx+' '+h0+'V'+(top+r)+'q0 -'+r+' '+r+' -'+r+'h'+(bw-2*r)+'q'+r+' 0 '+r+' '+r+'V'+h0+'z':'M'+cx+' '+h0+'V'+(top+hh-r)+'q0 '+r+' '+r+' '+r+'h'+(bw-2*r)+'q'+r+' 0 '+r+' -'+r+'V'+h0+'z';
      return '<g class="fc-bar" tabindex="0"><rect x="'+(cx-3)+'" y="0" width="'+(bw+6)+'" height="'+H+'" fill="transparent"/><path d="'+d+'" fill="'+(pos?'#0a9fb8':'#ff4655')+'"/><text x="'+(cx+bw/2)+'" y="'+(H+16)+'" class="fc-tick" text-anchor="middle">'+x.w+'</text><title>S'+x.s+' · semaine '+x.w+' : '+sgn(x.net)+' (sponsors '+x.sponsor+', primes '+x.bonus+', boutique '+x.merch+', salaires et staff −'+(x.sal+x.staff)+')</title></g>'}).join('')+'</svg></div>':'<div class="muted">Le graphique apparaît après la première semaine jouée.</div>';
  const line=(l,v,mxv,c)=>'<div class="fin-l"><span>'+l+'</span>'+qbar(100*v/Math.max(1,mxv),c)+'<b class="num">'+v+' k€</b></div>';
  const m2=Math.max(inc,out);
  const flows='<section class="panel"><h2>Flux hebdomadaires</h2><div class="cs-cap">Revenus · '+inc+' k€</div>'+line('Sponsors ('+S.spons.length+')',S.sponsor.weekly,m2,'var(--good)')+line('Boutique',merch,m2,'var(--good)')+'<div class="cs-cap">Dépenses · '+out+' k€</div>'+line('Salaires joueurs',sal,m2,'var(--red)')+line('Staff et structure',staff,m2,'var(--red)')+
    '<div class="muted small">Prime de victoire : +'+S.sponsor.win+' k€ par victoire. Dotations '+S.lg+' : '+ke(180*f)+' au champion, '+ke(110*f)+' au finaliste, '+ke(60*f)+' aux demi-finalistes.</div></section>';
  const dir='<section class="panel"><h2>Direction</h2><div>Objectif : <b>'+objLabel(S.objective)+'</b></div><div class="st-q"><span>Confiance</span>'+qbar(S.conf,S.conf>=50?'var(--gold)':S.conf>=30?'var(--warn)':'var(--red)')+'<b class="num">'+S.conf+' %</b></div>'+
    '<div class="cs-cap">Palmarès</div>'+(S.history.length?'<table>'+S.history.map(h=>'<tr><td>Saison '+h.s+'</td><td>'+h.rank+(h.rank===1?'er':'e')+'</td><td class="muted">Champion '+esc(h.champ)+'</td></tr>').join('')+'</table>':'<div class="muted small">Aucune saison terminée.</div>')+
    '<div class="row" style="margin-top:auto">'+(U.confirmNew?'<span class="small">Effacer la partie en cours ?</span><button class="btn sm" data-act="newgame">Oui, changer de club</button><button class="btn sm" data-act="cancelnew">Annuler</button>':'<button class="btn sm" data-act="asknew">Nouvelle partie</button>')+'</div></section>';
  const tab='<section class="panel"><h2>Dernières semaines</h2><div class="scroll"><table><tr><th>Semaine</th><th class="r">Sponsors</th><th class="r">Primes</th><th class="r">Boutique</th><th class="r">Salaires et staff</th><th class="r">Solde</th></tr>'+
    (S.finance.slice(-10).reverse().map(x=>'<tr><td>S'+x.s+' · sem. '+x.w+'</td><td class="r num">'+x.sponsor+'</td><td class="r num">'+x.bonus+'</td><td class="r num">'+x.merch+'</td><td class="r num">−'+(x.sal+x.staff)+'</td><td class="r num '+(x.net>=0?'good':'bad')+'">'+sgn(x.net)+'</td></tr>').join('')||'<tr><td colspan="6" class="muted">Aucune semaine jouée.</td></tr>')+'</table></div></section>';
  return '<div class="grid">'+head+'<section class="panel"><div class="row sp"><h2>Solde par semaine</h2><span class="muted small">'+F.length+' dernières semaines · survolez une barre pour le détail</span></div>'+chart+'</section><div class="grid g2"><div class="grid">'+flows+'</div><div class="grid">'+dir+'</div></div>'+tab+'</div>'}

<script>
/* Application installable : service worker, bouton d'installation, conseil iPhone */
(function(){
  if(window.__desktop){setInterval(()=>fetch('/__ping').catch(()=>{}),4000);fetch('/__ping').catch(()=>{})}
  else if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__inst=e;try{render()}catch(x){}});
  window.addEventListener('appinstalled',()=>{window.__inst=null;try{toast('Quintet est installé sur votre appareil.','gold');render()}catch(x){}});
  ACT.install=function(){const e=window.__inst;if(!e)return;e.prompt();e.userChoice.finally(()=>{window.__inst=null;render()})};
  const base=vMenu;vMenu=function(){let h=base();if(standalone||window.__desktop)return h;
    const btn=window.__inst?'<button class="ts-item ts-inst" data-act="install"><span class="ts-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 3h2v9l3-3 1.4 1.4L12 15.8 6.6 10.4 8 9l3 3zM5 18h14v2H5z"/></svg></span><span class="ts-txt"><b>Installer l\'application</b><small>Icône sur l\'écran d\'accueil, plein écran, jouable hors ligne</small></span><span class="ts-chev" aria-hidden="true"></span></button>'
      :ios?'<div class="ts-hint">Pour installer Quintet sur iPhone : bouton Partager, puis « Sur l\'écran d\'accueil ».</div>':'';
    return btn?h.replace('<div class="ts-menu" role="group" aria-label="Menu principal">','<div class="ts-menu" role="group" aria-label="Menu principal">'+btn):h};
  try{render()}catch(x){}
})();
